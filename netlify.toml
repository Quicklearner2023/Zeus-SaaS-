# netlify.toml - Netlify Production Build & Routing Configuration
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API Redirect: Routes all /api requests to the serverless function
[[redirects]]
  force = true
  from = "/api/*"
  to = "/.netlify/functions/server/api/:splat"
  status = 200

# SPA Fallback Redirect: Routes all other requests to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Production Security Headers
[[headers]]
  for = "/*"
    [headers.values]
      X-Frame-Options = "DENY"
      X-Content-Type-Options = "nosniff"
      Referrer-Policy = "no-referrer-when-downgrade"
